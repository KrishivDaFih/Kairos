<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS — Orb</title>
<style>
  :root{
    --bg: #060a10;
    --cyan: #4fd3f5;
    --cyan-dim: #1d5c6e;
    --cyan-glow: rgba(79, 211, 245, 0.55);
    --text-dim: #7fa6b3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 0%, #0a1622 0%, #060a10 55%, #030507 100%);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  .screen {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid rgba(79, 211, 245, 0.18);
    background: linear-gradient(180deg, rgba(10,20,30,0.6), rgba(10,20,30,0));
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-ring {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid var(--cyan);
    box-shadow: 0 0 10px var(--cyan-glow), inset 0 0 6px var(--cyan-glow);
    position: relative;
  }
  .brand-ring::after{
    content:"";
    position:absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    opacity: 0.9;
  }

  .brand-name {
    font-size: 22px;
    letter-spacing: 6px;
    font-weight: 500;
    color: #eaf6fb;
  }

  .clock-block {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .clock-time {
    font-size: 26px;
    font-weight: 600;
    color: var(--cyan);
    letter-spacing: 1px;
  }
  .clock-time small{
    font-size: 13px;
    font-weight: 500;
    margin-left: 4px;
    color: var(--text-dim);
  }
  .clock-date {
    font-size: 13px;
    color: var(--text-dim);
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .status-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .status-item svg { width: 20px; height: 20px; stroke: var(--cyan); fill: none; }

  /* ---------- ORB ---------- */
  .orb-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .orb-wrap {
    position: relative;
    width: 340px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(79, 211, 245, 0.25);
  }
  .ring.r1 { width: 100%; height: 100%; animation: spin 30s linear infinite; }
  .ring.r2 { width: 80%; height: 80%; border-style: dashed; animation: spin 22s linear infinite reverse; }
  .ring.r3 { width: 62%; height: 62%; border-color: rgba(79,211,245,0.4); animation: pulse 3.5s ease-in-out infinite; }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.04); }
  }

  .orb-glow {
    position: absolute;
    width: 46%;
    height: 46%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(79,211,245,0.55) 0%, rgba(79,211,245,0.12) 55%, transparent 75%);
    filter: blur(4px);
    animation: pulse 3.5s ease-in-out infinite;
  }

  .orb-core {
    position: relative;
    width: 40%;
    height: 40%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orb-core svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 16px var(--cyan-glow));
  }
  .orb-core .reactor-spin {
    animation: spin 40s linear infinite;
    transform-origin: 358px 358px;
  }
  .orb-core .reactor-spin-rev {
    animation: spin 26s linear infinite reverse;
    transform-origin: 358px 358px;
  }
  .orb-core .reactor-pulse {
    animation: pulse 2.4s ease-in-out infinite;
    transform-origin: 358px 358px;
  }

  /* ---------- ORB STATE MODULATION ---------- */
  /* idle = base animation speeds already defined above. Other states retune
     the same rings/glow/core rather than introducing a new accent color. */

  .orb-wrap.listening .ring.r3,
  .orb-wrap.listening .orb-glow { animation-duration: 1.1s; }
  .orb-wrap.listening .ring.r1 { animation-duration: 10s; }
  .orb-wrap.listening .ring.r2 { animation-duration: 8s; }

  .orb-wrap.thinking .ring.r1 { animation-duration: 4s; }
  .orb-wrap.thinking .ring.r2 { animation-duration: 3.2s; }
  .orb-wrap.thinking .ring.r3,
  .orb-wrap.thinking .orb-glow { animation-duration: 0.7s; }
  .orb-wrap.thinking .orb-core .reactor-spin { animation-duration: 6s; }
  .orb-wrap.thinking .orb-core .reactor-spin-rev { animation-duration: 4s; }

  .orb-wrap.speaking .ring.r3,
  .orb-wrap.speaking .orb-glow { animation: speakPulse 0.42s ease-in-out infinite; }

  @keyframes speakPulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.09); }
  }

  /* ---------- SUBTITLE READOUT ---------- */
  .subtitle {
    position: absolute;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, 84%);
    text-align: center;
    color: #eafcff;
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: 0.2px;
    text-shadow: 0 0 12px rgba(79,211,245,0.35);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    max-height: 140px;
    overflow-y: auto;
  }
  .subtitle.visible { opacity: 1; pointer-events: auto; }
  .subtitle .label {
    display: block;
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 3px;
    margin-bottom: 6px;
    opacity: 0.8;
  }

  /* ---------- INPUT BAR ---------- */
  .input-bar {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    width: min(620px, 90%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 10px 18px;
    background: rgba(10, 20, 28, 0.65);
    border: 1px solid rgba(79, 211, 245, 0.35);
    border-radius: 4px;
    box-shadow: 0 0 24px rgba(79, 211, 245, 0.12), inset 0 0 20px rgba(79,211,245,0.04);
    backdrop-filter: blur(6px);
  }
  .input-bar::before,
  .input-bar::after {
    content: "";
    position: absolute;
    top: -1px; bottom: -1px;
    width: 10px;
    border-color: var(--cyan);
    opacity: 0.7;
  }
  .input-bar::before { left: -1px; border-left: 2px solid var(--cyan); border-top: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan); }
  .input-bar::after { right: -1px; border-right: 2px solid var(--cyan); border-top: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan); }

  .input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #eafcff;
    font-size: 14px;
    font-family: inherit;
    letter-spacing: 0.2px;
  }
  .input-bar input::placeholder { color: var(--text-dim); }

  .icon-btn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid rgba(79,211,245,0.4);
    background: rgba(79,211,245,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .icon-btn:hover { background: rgba(79,211,245,0.16); }
  .icon-btn svg { width: 16px; height: 16px; stroke: var(--cyan); fill: none; }
  .icon-btn.active {
    background: rgba(79,211,245,0.3);
    box-shadow: 0 0 14px var(--cyan-glow);
  }
  .icon-btn.send svg { fill: var(--cyan); stroke: none; }

  .status-item.clickable { cursor: pointer; }
  .status-item.clickable:hover { color: var(--cyan); }
  .status-item.clickable svg { transition: opacity 0.2s ease; }

  /* ---------- TRANSCRIPT LOG PANEL ---------- */
  .log-panel {
    position: absolute;
    top: 0;
    right: -340px;
    width: 320px;
    height: 100%;
    background: rgba(6, 12, 18, 0.92);
    border-left: 1px solid rgba(79, 211, 245, 0.25);
    backdrop-filter: blur(8px);
    transition: right 0.35s ease;
    display: flex;
    flex-direction: column;
    z-index: 20;
  }
  .log-panel.open { right: 0; }
  .log-header {
    padding: 18px 20px 12px;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--cyan);
    border-bottom: 1px solid rgba(79,211,245,0.18);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-header .close-log { cursor: pointer; color: var(--text-dim); font-size: 16px; line-height: 1; }
  .log-header .close-log:hover { color: var(--cyan); }
  .log-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .log-entry { font-size: 13px; line-height: 1.5; }
  .log-entry .who {
    font-size: 10px;
    letter-spacing: 2px;
    display: block;
    margin-bottom: 3px;
  }
  .log-entry.user .who { color: var(--text-dim); }
  .log-entry.user { color: #cfe9f0; }
  .log-entry.jarvis .who { color: var(--cyan); }
  .log-entry.jarvis { color: #eafcff; }
  .log-body::-webkit-scrollbar { width: 5px; }
  .log-body::-webkit-scrollbar-thumb { background: rgba(79,211,245,0.3); border-radius: 3px; }

  @media (max-width: 700px) {
    .clock-date, .status-item span { display: none; }
    .brand-name { font-size: 16px; letter-spacing: 4px; }
    .orb-wrap { width: 240px; height: 240px; }
    .log-panel { width: 86%; right: -100%; }
    .subtitle { bottom: 86px; font-size: 13px; }
  }
</style>
</head>
<body>

    <div class="topbar">
      <div class="brand">

        <div class="brand-name">JARVIS</div>

<script>
  function pad(n){ return n.toString().padStart(2,'0'); }
  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('clockTime').innerHTML = `${pad(h)}:${pad(now.getMinutes())} <small>${ampm}</small>`;
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('clockDate').textContent = `${days[now.getDay()]}, ${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;
  }
  updateClock();
  setInterval(updateClock, 1000 * 30);

  /* =====================================================================
     JARVIS — conversation engine
     Wires the orb UI to the Claude API (via window.fetch, no key needed
     in this environment) using the persona system prompt below.
     ===================================================================== */

  const SYSTEM_PROMPT = `You are Jarvis, a highly capable personal AI assistant.

Your purpose is to help the user think, plan, create, research, write, organize, and complete practical work. Be proactive, precise, calm, and dependable. Treat each request as a collaboration: understand the goal, make sensible assumptions, and clearly communicate the result.

Core personality:
- Be intelligent, composed, concise, and warm.
- Speak naturally, with quiet confidence — never robotic, overly flattering, or theatrical.
- Lead with the outcome or most useful answer.
- Use plain language unless technical depth is useful.
- State uncertainty honestly. Never invent results, sources, or actions you have not actually taken.
- You are a conversational voice/text assistant embedded in a HUD interface — you cannot browse the web, run code, or take real-world actions. If asked to do something outside that scope, say so plainly and offer the closest useful alternative (e.g. drafting text, explaining steps, reasoning through a problem).
- Keep responses reasonably concise by default, since they are read on a small HUD readout and may be spoken aloud — expand only when the user asks for depth or the topic requires it.
- Avoid excessive headings, repetition, disclaimers, or generic motivational language.`;

  const orbWrap = document.getElementById('orbWrap');
  const subtitle = document.getElementById('subtitle');
  const subtitleLabel = document.getElementById('subtitleLabel');
  const subtitleText = document.getElementById('subtitleText');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const logToggle = document.getElementById('logToggle');
  const closeLog = document.getElementById('closeLog');
  const logPanel = document.getElementById('logPanel');
  const logBody = document.getElementById('logBody');

  let history = []; // {role, content}
  let busy = false;
  let subtitleTimer = null;

  function setOrbState(state) {
    orbWrap.classList.remove('listening', 'thinking', 'speaking');
    if (state) orbWrap.classList.add(state);
  }

  function showSubtitle(label, text, autoHide) {
    subtitleLabel.textContent = label;
    subtitleText.textContent = text;
    subtitle.classList.add('visible');
    clearTimeout(subtitleTimer);
    if (autoHide) {
      subtitleTimer = setTimeout(() => subtitle.classList.remove('visible'), autoHide);
    }
  }

  function logMessage(who, text) {
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + who;
    const whoLabel = document.createElement('span');
    whoLabel.className = 'who';
    whoLabel.textContent = who === 'user' ? 'YOU' : 'JARVIS';
    entry.appendChild(whoLabel);
    entry.appendChild(document.createTextNode(text));
    logBody.appendChild(entry);
    logBody.scrollTop = logBody.scrollHeight;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.02;
      utter.pitch = 0.9;
      utter.onstart = () => setOrbState('speaking');
      utter.onend = () => setOrbState(null);
      utter.onerror = () => setOrbState(null);
      window.speechSynthesis.speak(utter);
    } catch (e) { /* speech synthesis unavailable — text-only is fine */ }
  }

  async function sendToJarvis(userText) {
    if (!userText || busy) return;
    busy = true;
    textInput.value = '';
    textInput.disabled = true;
    sendBtn.style.opacity = '0.5';

    history.push({ role: 'user', content: userText });
    logMessage('user', userText);
    showSubtitle('YOU', userText, null);
    setOrbState('thinking');

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });

      if (!response.ok) throw new Error('Request failed: ' + response.status);
      const data = await response.json();
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const replyText = textBlocks.join('\n').trim() || '…';

      history.push({ role: 'assistant', content: replyText });
      logMessage('jarvis', replyText);
      showSubtitle('JARVIS', replyText, 9000);
      speak(replyText);
      if (!('speechSynthesis' in window)) setOrbState(null);

    } catch (err) {
      const failMsg = 'I couldn\u2019t reach the network just now. Try again in a moment.';
      logMessage('jarvis', failMsg);
      showSubtitle('JARVIS', failMsg, 6000);
      setOrbState(null);
    } finally {
      busy = false;
      textInput.disabled = false;
      sendBtn.style.opacity = '1';
      textInput.focus();
    }
  }

  sendBtn.addEventListener('click', () => sendToJarvis(textInput.value.trim()));
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendToJarvis(textInput.value.trim());
  });

  logToggle.addEventListener('click', () => logPanel.classList.toggle('open'));
  closeLog.addEventListener('click', () => logPanel.classList.remove('open'));

  /* ---------- voice input (Web Speech API, Chrome/Edge only) ---------- */
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognizer = null;

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.continuous = false;
    recognizer.interimResults = false;
    recognizer.lang = 'en-US';

    recognizer.onstart = () => {
      recognizing = true;
      micBtn.classList.add('active');
      setOrbState('listening');
      showSubtitle('LISTENING', '…', null);
    };
    recognizer.onresult = (event) => {
      const said = event.results[0][0].transcript;
      sendToJarvis(said);
    };
    recognizer.onerror = () => {
      recognizing = false;
      micBtn.classList.remove('active');
      setOrbState(null);
      subtitle.classList.remove('visible');
    };
    recognizer.onend = () => {
      recognizing = false;
      micBtn.classList.remove('active');
      if (!busy) setOrbState(null);
    };

    micBtn.addEventListener('click', () => {
      if (recognizing) { recognizer.stop(); return; }
      try { recognizer.start(); } catch (e) { /* already running */ }
    });
  } else {
    micBtn.style.opacity = '0.35';
    micBtn.title = 'Voice input not supported in this browser';
  }
</script>
</body>
</html>
